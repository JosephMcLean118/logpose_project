{% extends 'logpose/base.html' %}

{% block title_block %}Login{% endblock %}

{% block body_block %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
      <div class="card-body p-4">
        <h3 class="text-center mb-1 fw-bold">Welcome back</h3>
        <p class="text-center text-secondary mb-4">Sign in to your account</p>

        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label small fw-semibold">Username</label>
            <input type="text" name="username" class="form-control"
                   placeholder="Enter your username" required
                   style="border-radius: 8px; border-color: var(--border);">
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control"
                   placeholder="Enter your password" required
                   style="border-radius: 8px; border-color: var(--border);">
          </div>

          <button type="submit" class="btn btn-accent w-100 mt-2">
            Sign In
          </button>
        </form>

        <p class="text-center mt-3 mb-0 small text-secondary">
          Don't have an account?
          <a href="{% url 'logpose:register' %}">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
